services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: woodcarver
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d woodcarver']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/woodcarver
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      CORS_ORIGIN: http://localhost:8080
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: web
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  db-data:
